{% extends "base.html" %}
{% block content %}
  <div class="grid">
    <div class="card" style="grid-column: span 12;">
      <h3>Overview</h3>
      <div class="metrics">
        <div class="metric">
          <div class="label">Total PnL</div>
          <div class="value" id="metric-pnl">-</div>
        </div>
        <div class="metric">
          <div class="label">Win Rate</div>
          <div class="value" id="metric-winrate">-</div>
        </div>
        <div class="metric">
          <div class="label">Open Positions</div>
          <div class="value" id="metric-open-positions">-</div>
        </div>
        <div class="metric">
          <div class="label">Signals</div>
          <div class="value" id="metric-signals">-</div>
        </div>
      </div>
    </div>

    <div class="card" style="grid-column: span 8;">
      <div class="header" style="margin-bottom: 8px;">
        <h3>Positions</h3>
        <span class="tag">Live</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th class="right">Qty</th>
            <th class="right">Avg</th>
            <th class="right">LTP</th>
            <th class="right">PnL</th>
            <th>Side</th>
          </tr>
        </thead>
        <tbody id="positions-body"></tbody>
      </table>
    </div>

    <div class="card" style="grid-column: span 4;">
      <div class="header" style="margin-bottom: 8px;">
        <h3>Signals</h3>
        <span class="tag warning">Fresh</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Type</th>
            <th class="right">Conf</th>
            <th class="right">RR</th>
          </tr>
        </thead>
        <tbody id="signals-body"></tbody>
      </table>
    </div>

    <div class="card" style="grid-column: span 12;">
      <h3>Controls</h3>
      <div class="controls">
        <select class="select" id="strategy">
          <option value="ADAPTIVE_AUTO">ADAPTIVE_AUTO</option>
          <option value="HIGH_CONVICTION">HIGH_CONVICTION</option>
          <option value="AGGRESSIVE_SCALP">AGGRESSIVE_SCALP</option>
          <option value="MID_TREND_SWING">MID_TREND_SWING</option>
          <option value="AGGRESSIVE_REVERSAL">AGGRESSIVE_REVERSAL</option>
        </select>
        <button class="button" id="refresh">Refresh</button>
      </div>
    </div>
  </div>

  <script id="initial-data" type="application/json">{{ initial_data|safe }}</script>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
